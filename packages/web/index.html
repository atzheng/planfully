<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f5" />
    <script>
      /* Sets data-theme before first paint. Mirrors src/theme/theme.ts. */
      (function () {
        try {
          var s = null;
          try {
            s = localStorage.getItem('planfully.theme');
          } catch (e) {}
          var d =
            s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', d ? '#141415' : '#f7f7f5');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Planfully</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
